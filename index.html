<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Talk to YEHYA</title>
  <link rel="icon" type="image/svg+xml" href="/logo">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#0a0a12; min-height:100vh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      font-family:'Segoe UI',system-ui,sans-serif; color:#e0e0f0; overflow:hidden;
    }
    #bg { position:fixed; inset:0; z-index:0; opacity:0.2; pointer-events:none; }

    .orb { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; z-index:0; opacity:0.18; transition:background 0.8s, opacity 0.8s; }
    .orb1 { width:500px; height:500px; background:#4f8aff; top:-100px; left:-150px; animation:orbMove1 12s ease-in-out infinite; }
    .orb2 { width:400px; height:400px; background:#a855f7; bottom:-100px; right:-100px; animation:orbMove2 15s ease-in-out infinite; }
    .orb3 { width:300px; height:300px; background:#06b6d4; bottom:20%; left:10%; animation:orbMove3 10s ease-in-out infinite; }
    @keyframes orbMove1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(120px,80px)} }
    @keyframes orbMove2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-100px,-60px)} }
    @keyframes orbMove3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,-80px)} }

    body.listening .orb1 { background:#4cff91; opacity:0.28; }
    body.listening .orb2 { background:#00e676; opacity:0.22; }
    body.listening .orb3 { background:#69f0ae; opacity:0.18; }
    body.speaking  .orb1 { background:#fb923c; opacity:0.30; }
    body.speaking  .orb2 { background:#f97316; opacity:0.25; }
    body.speaking  .orb3 { background:#fbbf24; opacity:0.20; }
    body.thinking  .orb1 { background:#c084fc; opacity:0.25; }
    body.thinking  .orb2 { background:#a855f7; opacity:0.28; }
    body.thinking  .orb3 { background:#e879f9; opacity:0.18; }

    .card {
      position:relative; z-index:1;
      display:flex; flex-direction:column; align-items:center; gap:24px;
      padding:40px 56px 36px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:32px; backdrop-filter:blur(20px);
    }
    h1 { font-size:1.1rem; font-weight:600; letter-spacing:0.25em; text-transform:uppercase; color:rgba(255,255,255,0.7); }

    #logoImg {
      width:64px; height:64px; object-fit:contain;
      animation: logoBob 3s ease-in-out infinite, logoGlow 2.5s ease-in-out infinite;
    }
    @keyframes logoBob {
      0%,100% { transform: translateY(0px) rotate(0deg); }
      25%      { transform: translateY(-6px) rotate(-3deg); }
      75%      { transform: translateY(-3px) rotate(3deg); }
    }
    @keyframes logoGlow {
      0%,100% { filter: drop-shadow(0 0 6px #4f8aff) drop-shadow(0 0 12px #4f8aff); }
      50%      { filter: drop-shadow(0 0 16px #a855f7) drop-shadow(0 0 32px #a855f7); }
    }

    #startBtn {
      padding:14px 40px; font-size:1rem; font-weight:700;
      letter-spacing:0.15em; text-transform:uppercase;
      background:linear-gradient(135deg,#4f8aff,#7c3aed);
      color:white; border:none; border-radius:50px; cursor:pointer;
      animation: btnPulse 2s ease-in-out infinite;
    }
    #startBtn:hover { transform:scale(1.06); }
    #startBtn.hidden { display:none; }
    @keyframes btnPulse {
      0%,100% { box-shadow: 0 0 16px rgba(79,138,255,0.4); }
      50%      { box-shadow: 0 0 32px rgba(124,58,237,0.8), 0 0 60px rgba(79,138,255,0.3); }
    }

    .avatar-wrap { position:relative; width:280px; height:280px; }
    .glow {
      position:absolute; inset:-20px; border-radius:50%;
      opacity:0; filter:blur(28px); transition:opacity 0.5s, background 0.5s; z-index:0;
    }
    body.listening .glow { background:radial-gradient(#4cff91,transparent 70%); opacity:0.7; }
    body.thinking  .glow { background:radial-gradient(#c084fc,transparent 70%); opacity:0.6; }
    body.speaking  .glow { background:radial-gradient(#fb923c,transparent 70%); opacity:0.65; }

    #avatarVideo {
      position:absolute; inset:0; width:280px; height:280px;
      object-fit:cover; border-radius:50%;
      border:3px solid rgba(255,255,255,0.12); z-index:1;
    }
    .pulse-ring {
      position:absolute; inset:-6px; border-radius:50%;
      border:2px solid #4cff91; opacity:0; z-index:3; pointer-events:none;
    }
    body.listening .pulse-ring { animation:pulseRing 1.5s ease-out infinite; }
    @keyframes pulseRing { 0%{opacity:0.8;transform:scale(1)} 100%{opacity:0;transform:scale(1.08)} }

    .spin-ring {
      position:absolute; inset:-8px; border-radius:50%;
      border:2.5px solid transparent;
      border-top-color:#c084fc; border-right-color:#c084fc;
      opacity:0; z-index:3; transition:opacity 0.3s; pointer-events:none;
    }
    body.thinking .spin-ring { opacity:1; animation:spin 1s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg);} }

    .status-row { display:flex; align-items:center; gap:9px; }
    .dot { width:8px; height:8px; border-radius:50%; background:#4f8aff; box-shadow:0 0 7px #4f8aff; transition:background 0.4s,box-shadow 0.4s; }
    body.listening .dot { background:#4cff91; box-shadow:0 0 7px #4cff91; }
    body.thinking  .dot { background:#c084fc; box-shadow:0 0 7px #c084fc; }
    body.speaking  .dot { background:#fb923c; box-shadow:0 0 7px #fb923c; }
    body.error     .dot { background:#f87171; box-shadow:0 0 7px #f87171; }
    .status-label { font-size:0.78rem; letter-spacing:0.16em; text-transform:uppercase; color:rgba(255,255,255,0.4); }

    .wave-row { display:flex; gap:4px; align-items:flex-end; height:30px; opacity:0; transition:opacity 0.3s; }
    body.speaking .wave-row { opacity:1; }
    .wave-row span { display:block; width:4px; border-radius:3px; background:#fb923c; height:6px; }
    body.speaking .wave-row span:nth-child(1){animation:w1 .50s ease-in-out infinite}
    body.speaking .wave-row span:nth-child(2){animation:w2 .60s ease-in-out infinite}
    body.speaking .wave-row span:nth-child(3){animation:w3 .45s ease-in-out infinite}
    body.speaking .wave-row span:nth-child(4){animation:w4 .55s ease-in-out infinite}
    body.speaking .wave-row span:nth-child(5){animation:w5 .50s ease-in-out infinite}
    body.speaking .wave-row span:nth-child(6){animation:w6 .65s ease-in-out infinite}
    body.speaking .wave-row span:nth-child(7){animation:w7 .48s ease-in-out infinite}
    @keyframes w1{0%,100%{height:4px}  50%{height:24px}}
    @keyframes w2{0%,100%{height:16px} 50%{height:6px}}
    @keyframes w3{0%,100%{height:22px} 50%{height:5px}}
    @keyframes w4{0%,100%{height:8px}  50%{height:26px}}
    @keyframes w5{0%,100%{height:18px} 50%{height:7px}}
    @keyframes w6{0%,100%{height:6px}  50%{height:20px}}
    @keyframes w7{0%,100%{height:20px} 50%{height:8px}}

    .transcript { max-width:360px; min-height:3em; font-size:0.98rem; line-height:1.65; text-align:center; color:rgba(255,255,255,0.8); background:rgba(255,255,255,0.05); border-radius:16px; padding:14px 20px; opacity:0; transition:opacity 0.4s; }
    .transcript.show { opacity:1; }

    .conn { position:fixed; top:18px; right:22px; z-index:10; display:flex; align-items:center; gap:6px; font-size:0.7rem; letter-spacing:0.1em; color:rgba(255,255,255,0.3); }
    .conn-dot { width:7px; height:7px; border-radius:50%; background:#444; transition:background 0.4s; }
    .conn-dot.on  { background:#4cff91; box-shadow:0 0 5px #4cff91; }
    .conn-dot.off { background:#f87171; }

    @keyframes fadeFlow {
      0%,100% { color:rgba(255,255,255,0.35); }
      50%      { color:rgba(100,180,255,0.9); }
    }
  </style>
</head>
<body class="idle">

<canvas id="bg"></canvas>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="conn"><div class="conn-dot" id="connDot"></div><span id="connLabel">Connecting…</span></div>

<div class="card">
  <img id="logoImg" src="/logo" alt="Yehya Logo"/>
  <h1>Talk to YEHYA</h1>
  <div style="font-size:0.85rem;color:rgba(255,255,255,0.45);letter-spacing:0.05em;text-align:center;line-height:1.6;">
    👋 Hey, I'm Yehya!<br>🧠 I know things. 😏 Ask me. I dare you.
  </div>

  <div class="avatar-wrap">
    <div class="glow"></div>
    <video id="avatarVideo" src="/avatar_video?v=5" poster="/avatar?v=5" playsinline muted preload="auto"></video>
    <div class="pulse-ring"></div>
    <div class="spin-ring"></div>
  </div>

  <div class="status-row">
    <div class="dot"></div>
    <div class="status-label" id="statusLabel">Ready</div>
  </div>
  <button id="startBtn">🎙️ Talk Now</button>
  <div class="wave-row"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="transcript" id="transcript"></div>
  <div style="font-size:0.75rem;letter-spacing:0.08em;text-align:center;margin-top:8px;animation:fadeFlow 3s ease-in-out infinite;">
    Powered by Yehya Hteit &copy; 2026 — All Rights Reserved
  </div>
</div>

<script>
// ── Particles ──────────────────────────────────────────────────────────────
(()=>{
  const c=document.getElementById('bg'),ctx=c.getContext('2d');let W,H;
  const pts=Array.from({length:55},()=>({x:Math.random()*1920,y:Math.random()*1080,r:Math.random()*1.2+.3,dx:(Math.random()-.5)*.18,dy:(Math.random()-.5)*.18,a:Math.random()*.4+.1}));
  const rz=()=>{W=c.width=innerWidth;H=c.height=innerHeight;};
  window.addEventListener('resize',rz);rz();
  (function d(){ctx.clearRect(0,0,W,H);pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(180,200,255,${p.a})`;ctx.fill();p.x+=p.dx;p.y+=p.dy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;});requestAnimationFrame(d);})();
})();

// ── Elements ───────────────────────────────────────────────────────────────
const video       = document.getElementById('avatarVideo');
const startBtn    = document.getElementById('startBtn');
const statusLabel = document.getElementById('statusLabel');
const transcript  = document.getElementById('transcript');
const connDot     = document.getElementById('connDot');
const connLabel   = document.getElementById('connLabel');

// ── State machine ──────────────────────────────────────────────────────────
const LABELS = { idle:'Ready', listening:'Listening…', thinking:'Thinking…', speaking:'Speaking', error:'Error' };

function setState(state, text='') {
  document.body.className = state;
  statusLabel.textContent = LABELS[state] || state;

  if (state === 'speaking') {
    video.loop = true;
    video.play().catch(()=>{});
  } else {
    video.pause();
    video.currentTime = 0;
  }

  if (text && (state === 'speaking' || state === 'error')) {
    transcript.textContent = (state === 'error' ? '⚠️ ' : '') + text;
    transcript.classList.add('show');
  } else if (state === 'idle' || state === 'listening') {
    transcript.classList.remove('show');
  }
}

// ── Audio playback ─────────────────────────────────────────────────────────
let currentAudio = null;
let isPlaying    = false;

function playAudioBytes(arrayBuffer) {
  return new Promise((resolve) => {
    // Stop any current playback
    if (currentAudio) {
      currentAudio.onended = null;
      currentAudio.onerror = null;
      currentAudio.pause();
      currentAudio = null;
    }

    const blob = new Blob([arrayBuffer], { type: 'audio/mpeg' });
    const url  = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;
    isPlaying    = true;

    const done = () => {
      isPlaying = false;
      currentAudio = null;
      URL.revokeObjectURL(url);
      resolve();
    };
    audio.onended = done;
    audio.onerror = done;
    audio.play().catch(done);
  });
}

function stopPlayback() {
  if (currentAudio && isPlaying) {
    currentAudio.onended = null;
    currentAudio.onerror = null;
    currentAudio.pause();
    currentAudio = null;
    isPlaying = false;
  }
}

// ── WebSocket ──────────────────────────────────────────────────────────────
let ws;
let sessionStarted = false;
let pendingAudioQueue = [];   // audio that arrived before button click
let pendingStateQueue = [];   // states that arrived before button click

const WS_PROTO = location.protocol === 'https:' ? 'wss:' : 'ws:';

function connect() {
  ws = new WebSocket(`${WS_PROTO}//${location.host}/ws`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    connDot.className = 'conn-dot on';
    connLabel.textContent = 'Connected';
    console.log('✅ WS connected');
  };

  ws.onmessage = async (e) => {
    if (e.data instanceof ArrayBuffer) {
      if (!sessionStarted) {
        pendingAudioQueue.push(e.data);
        return;
      }
      setState('speaking');
      await playAudioBytes(e.data);
      setState('idle');
      startListening();
    } else {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      console.log('📨 state:', m.state, m.text || '');

      if (!sessionStarted) {
        pendingStateQueue.push(m);
        return;
      }
      applyState(m);
    }
  };

  ws.onclose = () => {
    connDot.className = 'conn-dot off';
    connLabel.textContent = 'Disconnected — retrying…';
    sessionStarted = false;
    stopRecording();
    setTimeout(connect, 3000);
  };
  ws.onerror = () => ws.close();
}
connect();

function applyState(m) {
  // Only apply state from server for non-audio states
  // (speaking state is managed by playAudioBytes)
  if (m.state === 'thinking') {
    setState('thinking', '');
  } else if (m.state === 'error') {
    setState('error', m.message || '');
  }
  // idle and speaking states are handled by audio playback flow
}

// ── Mic recording ──────────────────────────────────────────────────────────
let mediaRecorder   = null;
let audioStream     = null;
let audioCtx        = null;
let analyserNode    = null;
let audioChunks     = [];
let recordingActive = false;
let silenceTimer    = null;
let hasSpoken       = false;

const SILENCE_MS  = 1500;   // ms of silence before auto-stop
const MIN_BLOB_SZ = 2000;   // bytes — smaller = silence only, skip
const MAX_REC_MS  = 25000;  // hard cap 25s

async function startListening() {
  if (recordingActive || !sessionStarted || isPlaying) return;

  try {
    setState('listening');
    recordingActive = true;
    audioChunks     = [];
    hasSpoken       = false;

    // Get mic (reuse stream if we have it)
    if (!audioStream || audioStream.getTracks().every(t => t.readyState === 'ended')) {
      audioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    }

    // AudioContext for silence detection
    if (!audioCtx || audioCtx.state === 'closed') {
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }
    const source = audioCtx.createMediaStreamSource(audioStream);
    analyserNode = audioCtx.createAnalyser();
    analyserNode.fftSize = 1024;
    source.connect(analyserNode);

    // MediaRecorder
    const mimeType = ['audio/webm;codecs=opus','audio/webm','audio/ogg'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    const opts = mimeType ? { mimeType } : {};
    mediaRecorder = new MediaRecorder(audioStream, opts);
    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = onRecordingStop;
    mediaRecorder.start(250);   // chunk every 250ms

    // Silence detection
    const floatBuf = new Float32Array(analyserNode.fftSize);
    let maxStop = setTimeout(stopRecording, MAX_REC_MS);

    const tick = () => {
      if (!recordingActive) { clearTimeout(maxStop); return; }

      analyserNode.getFloatTimeDomainData(floatBuf);
      const rms = Math.sqrt(floatBuf.reduce((s, v) => s + v * v, 0) / floatBuf.length);

      if (rms > 0.01) {
        hasSpoken = true;
        if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
      } else if (hasSpoken && !silenceTimer) {
        silenceTimer = setTimeout(() => {
          clearTimeout(maxStop);
          stopRecording();
        }, SILENCE_MS);
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);

  } catch (err) {
    console.error('Mic error:', err);
    setState('error', 'Microphone access denied. Please allow mic and refresh.');
    recordingActive = false;
  }
}

function stopRecording() {
  if (!recordingActive) return;
  recordingActive = false;
  if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
}

async function onRecordingStop() {
  if (audioChunks.length === 0 || !hasSpoken) {
    // Nothing was said — go back to listening
    setState('idle');
    setTimeout(startListening, 300);
    return;
  }

  const mimeType = mediaRecorder ? mediaRecorder.mimeType : 'audio/webm';
  const blob = new Blob(audioChunks, { type: mimeType });
  audioChunks = [];

  if (blob.size < MIN_BLOB_SZ) {
    setState('idle');
    setTimeout(startListening, 300);
    return;
  }

  setState('thinking');

  if (ws && ws.readyState === WebSocket.OPEN) {
    const buf = await blob.arrayBuffer();
    ws.send(buf);
    // Server will send audio back → playAudioBytes → startListening
  } else {
    setState('idle');
    setTimeout(startListening, 1000);
  }
}

// ── Interrupt monitor ──────────────────────────────────────────────────────
function startInterruptMonitor() {
  const monAnalyser = audioCtx.createAnalyser();
  monAnalyser.fftSize = 512;
  const src = audioCtx.createMediaStreamSource(audioStream);
  src.connect(monAnalyser);
  const buf = new Float32Array(monAnalyser.fftSize);
  let loudCount = 0;

  const check = () => {
    if (!isPlaying) { loudCount = 0; requestAnimationFrame(check); return; }
    monAnalyser.getFloatTimeDomainData(buf);
    const rms = Math.sqrt(buf.reduce((s,v)=>s+v*v,0)/buf.length);
    if (rms > 0.05) {
      if (++loudCount >= 4) {
        console.log('⚡ Interrupt');
        stopPlayback();
        setState('idle');
        loudCount = 0;
        setTimeout(startListening, 100);
      }
    } else { loudCount = 0; }
    requestAnimationFrame(check);
  };
  requestAnimationFrame(check);
}

// ── Start session (button click) ───────────────────────────────────────────
startBtn.addEventListener('click', async () => {
  try {
    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioCtx    = new AudioContext();
  } catch (err) {
    alert('Microphone access is required. Please allow it and try again.');
    return;
  }

  startBtn.classList.add('hidden');
  sessionStarted = true;

  // Unlock video element
  video.loop = true;
  video.play().then(() => { video.pause(); video.currentTime = 0; }).catch(()=>{});

  // Start interrupt monitor
  startInterruptMonitor();

  // Drain queued states
  for (const m of pendingStateQueue) applyState(m);
  pendingStateQueue = [];

  if (pendingAudioQueue.length > 0) {
    // Play queued greeting now that audio is unlocked
    setState('speaking');
    for (const buf of pendingAudioQueue) {
      await playAudioBytes(buf);
    }
    pendingAudioQueue = [];
    setState('idle');
    startListening();
  } else {
    // Greeting might still be coming — wait for it via ws.onmessage
    // or start listening if ws already sent idle
    setState('idle');
    setTimeout(startListening, 800);
  }
});
</script>
</body>
</html>
